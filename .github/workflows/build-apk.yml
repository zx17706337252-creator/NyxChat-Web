name: Build NyxChat APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build web app (dist/)
        run: npm run build
        
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyxchat-dist
          path: dist/
          
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
        
      - name: Init Capacitor and add Android
        run: |
          npx cap init --web-dir dist NyxChat com.nyxchat.app
          npx cap add android
          npx cap sync android
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NyxChat-Web-APK
          path: android/app/build/outputs/apk/debug/*.apk
